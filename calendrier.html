<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier des sorties 2026 - Dico.Manga</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e63946">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-group">
        <a href="index.html" class="logo">
          <img src="images/logo.svg" alt="DICO.MANGA" class="logo-img">
          <span data-i18n="siteSubtitle">Un dictionnaire de mangas</span>
        </a>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <a href="index.html" class="back-btn" data-i18n="backToLibrary">
      ← Retour à la bibliothèque
    </a>

    <h1 class="page-title">Sorties 2026</h1>

    <div class="calendar-summary" id="calendarSummary">
      <!-- Generated by JS: total releases + jump-to-month chips -->
    </div>

    <div class="calendar-content" id="calendarContent">
      <!-- Generated by JS: one section per month -->
    </div>

    <p class="calendar-source">
      Dates de sortie françaises agrégées depuis Nautiljon — peut contenir des
      écarts par rapport aux annonces des éditeurs.
    </p>
  </main>

  <footer>
    <p class="footer-credit"><a href="privacy.html" data-i18n="privacyPolicy">Politique de confidentialité</a></p>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/data.js"></script>
  <script src="js/manga-slugs.js"></script>
  <script src="js/calendar-2026.js"></script>
  <script src="js/calendar.js"></script>
  <!-- Thème : voir js/theme.js -->
</body>
</html>

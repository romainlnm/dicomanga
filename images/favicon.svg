<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>

  <!-- Lignes de vitesse -->
  <line x1="2" y1="8" x2="8" y2="8" stroke="#e63946" stroke-width="2" opacity="0.5"/>
  <line x1="3" y1="12" x2="7" y2="12" stroke="#e63946" stroke-width="1.5" opacity="0.4"/>
  <line x1="2" y1="24" x2="7" y2="24" stroke="#e63946" stroke-width="1.5" opacity="0.4"/>

  <!-- Texte D stylisé -->
  <text x="9" y="24" font-family="Arial Black, Impact, sans-serif" font-size="20" font-weight="900" fill="url(#grad)">D</text>

  <!-- Point rouge -->
  <circle cx="26" cy="22" r="3" fill="#e63946"/>
</svg>

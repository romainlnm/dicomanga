<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 96">
  <!-- Logo DicoManga — variante lettrage encre pour les thèmes à header clair
       (mono, sakura, retro, arctique). Même construction que logo.svg. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
    <linearGradient id="seal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e64250"/><stop offset="1" stop-color="#b81b29"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a227"/><stop offset="0.5" stop-color="#f2d272"/><stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>

  <g stroke="#b81b29" stroke-linecap="round" opacity="0.5">
    <line x1="88" y1="18" x2="150" y2="18" stroke-width="3" stroke-dasharray="30 60">
      <animate attributeName="stroke-dashoffset" values="90;0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="12" x2="300" y2="12" stroke-width="2.4" stroke-dasharray="24 70">
      <animate attributeName="stroke-dashoffset" values="94;0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="22" x2="400" y2="22" stroke-width="2" stroke-dasharray="20 55">
      <animate attributeName="stroke-dashoffset" values="75;0" dur="1.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <g transform="rotate(2 38 48)">
    <g filter="url(#rough)">
      <rect x="12" y="8" width="52" height="80" rx="6" fill="url(#seal)"/>
    </g>
    <rect x="17.5" y="13.5" width="41" height="69" rx="3.5" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
    <text x="38" y="42" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif" font-size="28" font-weight="800" fill="#fff">漫</text>
    <text x="38" y="74" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif" font-size="28" font-weight="800" fill="#fff">画</text>
  </g>

  <text x="86" y="58" font-family="'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif" font-size="45" fill="#181820"><tspan font-weight="800">D</tspan><tspan font-weight="600">ico</tspan><tspan font-weight="800" fill="#b81b29">M</tspan><tspan font-weight="600" fill="#b81b29">anga</tspan></text>

  <rect x="88" y="66" width="300" height="1.8" rx="0.9" fill="#b81b29"/>

  <text x="90" y="85" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="11.5" font-weight="600" letter-spacing="5" fill="#6b6355">ディコマンガ辞典</text>
</svg>

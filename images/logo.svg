<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <defs>
    <!-- Dégradé pour le texte principal -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>

    <!-- Dégradé pour l'effet de vitesse -->
    <linearGradient id="speedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Lignes de vitesse dynamiques -->
  <g class="speed-lines" opacity="0.6">
    <line x1="0" y1="20" x2="45" y2="20" stroke="url(#speedGradient)" stroke-width="2"/>
    <line x1="5" y1="30" x2="40" y2="30" stroke="url(#speedGradient)" stroke-width="3"/>
    <line x1="0" y1="40" x2="50" y2="40" stroke="url(#speedGradient)" stroke-width="2"/>
    <line x1="10" y1="50" x2="45" y2="50" stroke="url(#speedGradient)" stroke-width="3"/>
    <line x1="0" y1="60" x2="40" y2="60" stroke="url(#speedGradient)" stroke-width="2"/>
  </g>

  <!-- Effet d'impact/explosion derrière le texte -->
  <g class="impact-effect" transform="translate(160, 40)">
    <polygon points="0,-35 5,-15 25,-20 10,-5 30,5 10,10 15,30 0,15 -15,30 -10,10 -30,5 -10,-5 -25,-20 -5,-15"
             fill="none" stroke="#e63946" stroke-width="1.5" opacity="0.4"/>
    <polygon points="0,-28 4,-12 20,-16 8,-4 24,4 8,8 12,24 0,12 -12,24 -8,8 -24,4 -8,-4 -20,-16 -4,-12"
             fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Texte principal DICO -->
  <text x="55" y="52" font-family="'Arial Black', 'Impact', sans-serif" font-size="38" font-weight="900"
        fill="url(#textGradient)" letter-spacing="-1"
        style="text-shadow: 3px 3px 0px #000, -1px -1px 0px #000;">
    DICO
  </text>

  <!-- Point séparateur stylisé -->
  <circle cx="153" cy="45" r="5" fill="#e63946"/>
  <circle cx="153" cy="45" r="8" fill="none" stroke="#e63946" stroke-width="1.5" opacity="0.5"/>

  <!-- Texte MANGA avec style incliné dynamique -->
  <text x="165" y="52" font-family="'Arial Black', 'Impact', sans-serif" font-size="38" font-weight="900"
        fill="#ffffff" letter-spacing="-1" transform="skewX(-5)"
        style="text-shadow: 3px 3px 0px #e63946, 4px 4px 0px #000;">
    MANGA
  </text>

  <!-- Lignes de vitesse à droite -->
  <g class="speed-lines-right" opacity="0.5">
    <line x1="290" y1="25" x2="320" y2="25" stroke="#e63946" stroke-width="2"/>
    <line x1="285" y1="35" x2="320" y2="35" stroke="#ff6b6b" stroke-width="2"/>
    <line x1="295" y1="45" x2="320" y2="45" stroke="#e63946" stroke-width="3"/>
    <line x1="285" y1="55" x2="320" y2="55" stroke="#ff6b6b" stroke-width="2"/>
  </g>

  <!-- Petits éclats décoratifs -->
  <g fill="#e63946" opacity="0.7">
    <polygon points="280,15 283,20 288,17 285,22 290,25 285,25 283,30 280,25 275,27 278,22 273,20 278,18" transform="scale(0.6) translate(420, 10)"/>
    <polygon points="50,65 52,68 55,66 54,70 57,72 54,72 52,75 50,72 47,73 49,70 46,68 49,67" transform="scale(0.7)"/>
  </g>
</svg>
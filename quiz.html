<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Manga - Dico.Manga</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e63946">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-group">
        <a href="index.html" class="logo">
          <img src="images/logo.svg" alt="DICO.MANGA" class="logo-img">
          <span>Un dictionnaire de mangas</span>
        </a>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <a href="index.html" class="back-btn">
      ← Retour à la bibliothèque
    </a>

    <!-- Écran d'accueil du quiz -->
    <div class="quiz-container" id="quizStart">
      <h1 class="quiz-title">Quiz Manga</h1>
      <p class="quiz-description">Testez vos connaissances sur les mangas !</p>

      <div class="quiz-best-score">
        <span>Meilleur score :</span>
        <span id="bestScore">0</span>/10
      </div>

      <div class="quiz-options">
        <label class="quiz-option-label">
          <input type="checkbox" id="timerOption" checked>
          <span>Timer (10s par question)</span>
        </label>
      </div>

      <button class="quiz-start-btn" onclick="initQuiz()">Commencer le Quiz</button>
    </div>

    <!-- Zone de question -->
    <div class="quiz-container quiz-hidden" id="quizGame">
      <div class="quiz-header">
        <div class="quiz-progress">
          Question <span id="questionNum">1</span>/10
        </div>
        <div class="quiz-score">
          Score: <span id="currentScore">0</span>
        </div>
        <div class="quiz-timer" id="timerDisplay">
          <span id="timerValue">10</span>s
        </div>
      </div>

      <div class="quiz-question-area" id="questionArea">
        <!-- Question générée par JS -->
      </div>

      <div class="quiz-answers" id="answersArea">
        <!-- Réponses générées par JS -->
      </div>
    </div>

    <!-- Écran de résultat -->
    <div class="quiz-container quiz-hidden" id="quizResult">
      <h2 class="quiz-result-title">Quiz terminé !</h2>

      <div class="quiz-final-score">
        <span id="finalScore">0</span>/10
      </div>

      <p class="quiz-result-message" id="resultMessage"></p>

      <div class="quiz-result-actions">
        <button class="quiz-restart-btn" onclick="initQuiz()">Rejouer</button>
        <a href="index.html" class="quiz-home-btn">Retour à l'accueil</a>
      </div>
    </div>
  </main>

  <footer>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
